media:
  input: assets/images
  output: /assets/images

content:

  # ============================================================
  # GITARREN
  # ============================================================

  - name: guitars
    label: "Gitarren"
    type: collection
    path: "_guitars"
    format: yaml-frontmatter

    fields:

      - name: title
        label: "Gitarrenname"
        type: string
        required: true

      - name: layout
        label: "Layout"
        type: string
        hidden: true
        default: "single"

      - name: build_year
        label: "Baujahr"
        type: string

      - name: guitar_type
        label: "Typ"
        type: string

      - name: cover_image
        label: "Titelbild"
        type: image

      - name: header
        label: "Vorschaubild"
        type: object
        fields:

          - name: teaser
            label: "Kachelbild"
            type: image

      - name: body
        label: "Beschreibung"
        type: rich-text

      - name: build_steps
        label: "Bauschritte"
        type: rich-text

      - name: gallery
        label: "Galerie"
        type: image
        options:
          multiple: true
          unique: true


  # ============================================================
  # BAUBERICHTE
  # ============================================================

  - name: build_reports
    label: "Bauberichte"
    type: collection
    path: "_posts"
    format: yaml-frontmatter

    fields:

      - name: title
        label: "Titel"
        type: string
        required: true

      - name: date
        label: "Datum"
        type: date
        required: true

      - name: body
        label: "Baubericht"
        type: rich-text


  # ============================================================
  # WERKSTATT
  # ============================================================

  - name: workshop
    label: "Werkstatt"
    type: collection
    path: "_workshop"
    format: yaml-frontmatter

    fields:

      - name: title
        label: "Titel"
        type: string
        required: true

      - name: layout
        label: "Layout"
        type: string
        hidden: true
        default: "single"

      - name: body
        label: "Inhalt"
        type: rich-text
