media:
  input: assets/images
  output: /assets/images

content:

  - name: guitars
    label: "Gitarren"
    type: collection
    path: "_guitars"
    format: yaml-frontmatter

    fields:
      - name: title
        label: "Gitarrenname"
        type: string

      - name: build_year
        label: "Baujahr"
        type: string

      - name: guitar_type
        label: "Typ"
        type: string

      - name: cover_image
        label: "Titelbild"
        type: image

      - name: body
        label: "Beschreibung"
        type: rich-text

  - name: build_reports
    label: "Bauberichte"
    type: collection
    path: "_posts"

    format: md

    slug: "{{year}}-{{month}}-{{day}}-{{fields.title | slugify}}"

    fields:
      - name: title
        label: "Titel"

        type: string

      - name: date
        label: "Datum"

        type: date

      - name: body
        label: "Baubericht"

        type: rich-text

  - name: workshop
    label: "Werkstatt"
    type: collection
    path: "_workshop"

    format: md

    fields:
      - name: title
        label: "Titel"

        type: string

      - name: body
        label: "Inhalt"

        type: rich-text
