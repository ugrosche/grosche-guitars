media:
  input: assets/images
  output: /assets/images

content:

  # ==========================================
  # Gitarren
  # ==========================================

  - name: guitars
    label: "Gitarren"
    type: collection
    path: "_guitars"
    format: md

    slug: "{{fields.title | slugify}}"

    fields:

      - name: title
        label: "Gitarrenname"
        type: string
        required: true

      - name: build_year
        label: "Baujahr"
        type: string

      - name: guitar_type
        label: "Typ"
        type: string

      - name: cover_image
        label: "Titelbild"
        type: image
        required: true

      - name: body
        label: "Projektbeschreibung"
        type: rich-text

      - name: build_steps
        label: "Bauschritte"
        type: object
        list: true

        fields:

          - name: title
            label: "Bauschritt"
            type: string
            required: true

          - name: description
            label: "Beschreibung des Bauschritts"
            type: rich-text

          - name: images
            label: "Bilder"
            type: object
            list: true

            fields:

              - name: image
                label: "Bild"
                type: image
                required: true

              - name: caption
                label: "Bildbeschreibung"
                type: string

              - name: alt
                label: "Alternativtext"
                type: string


  # ==========================================
  # Bauberichte / Blog
  # ==========================================

  - name: build_reports
    label: "Bauberichte"
    type: collection
    path: "_posts"
    format: md

    slug: "{{year}}-{{month}}-{{day}}-{{fields.title | slugify}}"

    fields:

      - name: title
        label: "Titel"
        type: string
        required: true

      - name: date
        label: "Datum"
        type: date
        required: true

      - name: body
        label: "Baubericht"
        type: rich-text


  # ==========================================
  # Werkstatt
  # ==========================================

  - name: workshop
    label: "Werkstatt"
    type: collection
    path: "_workshop"
    format: md

    slug: "{{fields.title | slugify}}"

    fields:

      - name: title
        label: "Titel"
        type: string
        required: true

      - name: body
        label: "Inhalt"
        type: rich-text
