media:
  input: assets/images
  output: /assets/images

content:
  - name: posts
    label: "Bauberichte"
    type: collection
    path: "_posts"
    format: md
    slug: "{{year}}-{{month}}-{{day}}-{{fields.title | slugify}}"
    fields:
      - name: title
        label: "Titel des Projekts"
        type: string
        required: true
      - name: date
        label: "Datum"
        type: date
        required: true
      - name: body
        label: "Baubericht"
        type: rich-text
        options: {}
